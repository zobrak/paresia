# Configuration du poste client ; dépendances : bibliothèque standard et server.commun.
# Suivi des versions
#   0.1.12  2026-11-08  Option ssh_keygen.
#   3.0.0-alpha.40  2026-11-06  Exemple complet de configuration de Paresia-admin.
#
# Adapter les valeurs au poste client ; aucun secret dans ce fichier.
# Priorités croissantes : /etc/paresia/paresia.conf, conf.d/NN-*.conf,
# $XDG_CONFIG_HOME/paresia/*.conf (sinon ~/.config/paresia/*.conf),
# puis PARESIA_ADMIN_<DOMAINE>_<CLE> en majuscules.
# Installer cet exemple dans la couche choisie, ou utiliser --config <chemin>.
# --config ou PARESIA_ADMIN_CONFIG remplace les couches fichier.
# Fichiers : propriétaire root ou utilisateur courant, sans écriture groupe/autres.

[admin.connexion]
# Adresse HTTPS de base : sans identifiant, chemin, requête ni fragment.
url = https://bunker.example.org
# Cible SSH de l'ouverture de présence.
hote_ssh = backend-admin.example.org
compte_ssh = app
# Chemin absolu de l'exécutable du poste client.
ssh = /usr/bin/ssh

[admin.cle]
# Clé publique uniquement ; la clé privée reste dans l'agent SSH.
cle_publique = /etc/paresia/admin.pub
# Commande forcée à inscrire dans authorized_keys sur le serveur.
commande_forcee = /usr/local/bin/pollux-session
# Exécutable ssh-keygen, utilisé pour signer le défi ; la clé privée reste dans l'agent SSH.
ssh_keygen = /usr/bin/ssh-keygen

[admin.presence]
# Attente de l'ouverture de session, en secondes ; défaut d'implémentation : 90.
ouverture_s = 90

[admin.interface]
# Étiquette BCP 47 ; une langue absente du dossier se replie sur fr-FR.
langue = fr-FR
dossier_i18n = /usr/local/share/paresia/i18n
