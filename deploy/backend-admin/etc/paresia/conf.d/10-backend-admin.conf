# 10-backend-admin.conf — surcharge d'installation de backend-admin (Pollux, pollux-session, Romulus).
# SPDX-License-Identifier: AGPL-3.0-or-later
# Rôle : couche 2 de la configuration (D29, D43), installée dans /etc/paresia/conf.d/ (root:root, 0644).
#   Complète /etc/paresia/paresia.conf (server/conf/paresia.conf) : elle fixe les uid et gid
#   numériques de l'installation (D42). Les chemins des sockets viennent du fichier de base (D40).
# Les numéros ci-dessous sont des exemples : le script d'installation
#   deploy/backend-admin/installer-backend-admin.sh les remplace par ceux que le système a attribués aux
#   comptes paresia-pollux, paresia-romulus, paresia-tunnel et app (répertoire /var/lib/paresia-app) et aux groupes
#   paresia-sessions, paresia-liaison et paresia-http ; www-data reste l'identifiant statique de Debian (33).
# Aucune adresse, aucun secret.
# Suivi des versions
#   0.1.0  2026-11-07  Numéros d'exemple remplacés à l'installation par ceux du système (D42, D47) ; commentaires par noms ; chemin cité : le script d'installation remplace la procédure pas à pas ; compte app hors /home : ProtectHome=yes, plus de montage (D44 et D136 révisées).
#   3.0.0-alpha.29  2026-11-06  Première version (D42, D43).
#   3.0.0-alpha.39  2026-11-06  Nom en minuscules de la procédure.
#   3.0.0-alpha.41  2026-11-06  Uid de Pollux et du tunnel pour l'aiguillage de Romulus.

[pollux.sessions]
# Socket de pollux-session : client = compte app, groupe paresia-sessions.
uid = 983
gid = 984

[pollux.relay]
# Socket de relais : client = compte paresia-romulus, groupe paresia-liaison.
uid = 981
gid = 985

[pollux.romulus]
# Socket de Romulus que Pollux joint : serveur = compte paresia-romulus.
uid = 981

[pollux.castor]
# Socket locale du tunnel vers Castor : serveur = compte paresia-tunnel, compte provisoire (D42).
uid = 982

[romulus.presence]
# Socket de présence : client = compte paresia-pollux, groupe paresia-liaison.
uid_pollux = 980
gid = 985

[romulus.http]
# Socket HTTP : client = lighttpd (www-data, 33), groupe paresia-http.
uid_lighttpd = 33
gid = 986

[romulus.bunker]
# bunkerd_uid : compte de bunkerd, non créé par le script d'installation. La valeur de l'exemple
# (server/conf/paresia.conf) doit être adaptée à l'installation ; elle n'est pas fixée ici.

[romulus.relay]
# Socket de relais de Pollux : serveur = compte paresia-pollux.
pollux_uid = 980
# Socket locale du tunnel vers Remus : serveur = compte paresia-tunnel, compte provisoire (D42).
remus_uid = 982
