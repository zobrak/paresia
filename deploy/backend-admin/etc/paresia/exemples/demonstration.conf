# demonstration.conf — configuration de démonstration de backend-admin.
# Rôle : active les métriques de Pollux et de Romulus pour que le domaine kernel (état et
#   métriques) ait des échantillons à montrer. Ce fichier n'est PAS posé par le script d'installation :
#   pour la démonstration seulement, on le copie dans /etc/paresia/conf.d/ sous le nom
#   20-demonstration.conf (propriétaire root, non inscriptible par un autre compte), puis on
#   redémarre les démons. Les livraisons gardent les métriques désactivées par défaut (D145).
# Dépendances : lecteur de server.commun.config (bibliothèque standard) ; voir docs/configuration.md.
# Suivi des versions
#   0.1.15  2026-11-08  Première version : métriques de Pollux et de Romulus activées pour la démonstration.

[pollux.metriques]
actif = true

[romulus.metriques]
actif = true
