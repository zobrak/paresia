# 50-paresia-app.conf — compte app de Paresia (session de présence, backend-admin).
# SPDX-License-Identifier: AGPL-3.0-or-later
# Rôle : réglages sshd du compte app, installés dans /etc/ssh/sshd_config.d/ (root:root, 0644). La
#   configuration principale doit inclure /etc/ssh/sshd_config.d/*.conf (à vérifier : procédure, étape 8).
# StrictModes et PermitUserEnvironment ne sont PAS permis dans un bloc Match (liste fermée de
#   sshd_config(5), section Match) : ils sont posés ici hors du bloc, à leur valeur par défaut d'OpenSSH
#   (yes et no), donc pour tous les comptes. Ils garantissent que les droits du répertoire personnel de app et de authorized_keys
#   sont contrôlés et que ni ~/.ssh/environment ni environment= ne sont lus.
# Le bloc Match s'étend jusqu'au prochain Match ou à la fin du fichier : il reste en dernier.
# La commande forcée est posée dans authorized_keys (restrict,command="/usr/local/bin/pollux-session").
# AcceptEnv : un bloc Match ne peut pas vider la liste posée par la configuration principale ;
#   le résidu (LANG, LC_*) est sans effet : le lanceur vide l'environnement (env -i).
# Suivi des versions
#   0.1.0  2026-11-07  Compte app hors /home : ProtectHome=yes, plus de montage (D44 et D136 révisées).
#   3.0.0-alpha.29  2026-11-06  Première version (D1, D44) ; StrictModes et PermitUserEnvironment hors Match.

StrictModes yes
PermitUserEnvironment no

Match User app
    ExposeAuthInfo yes
    ClientAliveInterval 15
    ClientAliveCountMax 3
    PasswordAuthentication no
    AuthenticationMethods publickey
