# Dossiers des sockets locales du tunnel SSH, isolés par groupe de démon.
# SPDX-License-Identifier: AGPL-3.0-or-later
# Suivi des versions
#   0.1.1  2026-11-07  Création indépendante du service ; parent réservé à root.
# tmpfiles.d(5), type d : crée les dossiers et ajuste mode et propriétaire s'ils existent.
# Les comptes et groupes système doivent exister avant systemd-tmpfiles --create.
# tmpfiles.d(5) crée le parent avant ses enfants ; lancé sous root, il crée les sous-dossiers
# sous le parent root:root 0711. ssh n'a besoin que d'y passer, sans droit d'écriture.
# Age « - » : aucun nettoyage périodique ; les dossiers survivent à l'arrêt du tunnel.
# Type Chemin                      Mode Utilisateur    Groupe           Age Argument
d /run/paresia-tunnel              0711 root           root             - -
d /run/paresia-tunnel/romulus      0710 paresia-tunnel paresia-romulus  - -
d /run/paresia-tunnel/pollux       0710 paresia-tunnel paresia-pollux   - -
