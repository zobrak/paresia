# Suivi des versions
#   0.1.8  2026-11-07  Déclaration du côté Romulus du relais strfry : domaine relay, ping de session, suivi différé (D148, D150, D154).
#
# Greffon livré avec Paresia, côté Romulus : le relais strfry est une paire de greffons de même
# nom de base, paresia-yin-strfry (côté Remus) et paresia-yang-strfry (ce fichier). Romulus
# aiguille le domaine « relay » vers Remus ; les paramètres des actions sont validés par Remus
# et publiés par son catalogue (relay/catalog/list et relay/catalog/describe lui sont transmis).
# Avant chaque transmission, Romulus pingue la session auprès de Pollux au plus une fois par
# battement ; un feu rouge du pair (relay_light_red) lui fait oublier ce ping.
format = 1
forme = "ponctuel"
greffon = "paresia-yang-strfry"
domaine = "relay"
section = "relay"
obligatoire = true
destination = "remus"
ping = true
ping_oubli = ["relay_light_red"]
catalogue = "pair"
codes = [
  "bad_request",
  "not_available",
  "relay_light_red",
  "session_closed",
  "peer_unavailable",
  "command_failed",
  "command_timeout",
  "command_busy",
  "internal_error",
]

# Section [romulus.relay] : socket locale du tunnel vers Remus et uid de son processus ;
# socket de Pollux pour le ping de session et son uid ; échéances ; longueur de ligne ; plafond
# de flux simultanés.
[[options]]
nom = "remus_socket"
type = "chemin"
role = "socket"

[[options]]
nom = "remus_uid"
type = "uid"
role = "uid"

[[options]]
nom = "pollux_socket"
type = "chemin"
role = "ping_socket"

[[options]]
nom = "pollux_uid"
type = "uid"
role = "ping_uid"

[[options]]
nom = "delai_s"
type = "duree"
defaut = 600
role = "delai"

[[options]]
nom = "ping_delai_s"
type = "duree"
defaut = 5
inferieure_a = "heartbeat_s"
role = "ping_delai"

[[options]]
nom = "heartbeat_s"
type = "duree"
defaut = 30
role = "battement"

[[options]]
nom = "max_line"
type = "limite"
defaut = 1048576
role = "max_line"

[[options]]
nom = "flux_max_simultanes"
type = "limite"
defaut = 8
maximum = 1024
role = "flux_max"

