# Compte tunnel : redirections locales seulement ; voir deploy/backend-relais/installer-backend-relais.sh (étapes tunnel_*).
# D69, D82 : StrictModes et PermitUserEnvironment hors Match, à leurs défauts.
# Match reste en dernier ; les Include suivants doivent être contrôlés par sshd -t.
# Suivi des versions
#   0.1.0  2026-11-07  Chemin cité : le script d'installation remplace la procédure pas à pas.
#   3.0.0-alpha.42  2026-11-07  Restrictions du tunnel (D63, D65).
StrictModes yes
PermitUserEnvironment no

Match User tunnel
    AllowTcpForwarding local
    AllowStreamLocalForwarding local
    PermitListen none
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    PasswordAuthentication no
    AuthenticationMethods publickey
