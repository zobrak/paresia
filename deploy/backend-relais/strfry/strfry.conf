##
## Paresia : configuration complète du relais strfry.
##
## Version du document : 3.0.0-alpha.41 · 2026-11-06.
## Source : strfry.conf amont à 4cd3cf6 ; écarts fixés par la décision D95.
## Toutes les options sont écrites avec leur valeur explicite ; aucune n'est omise.
##

# Dossier de la base de données (chemin absolu dans le conteneur, écart avec l'amont "./strfry-db/").
db = "/app/strfry-db/"

dbParams {
    # Nombre maximal de lecteurs simultanés de la base (valeur amont).
    maxreaders = 256

    # Taille maximale de la base, en octets : 10 Tio (valeur amont).
    mapsize = 10995116277760

    # Désactive la lecture anticipée du système de fichiers (valeur amont).
    noReadAhead = false
}

events {
    # Taille maximale d'un événement, en octets (valeur amont).
    maxEventSize = 65536

    # Refuse les événements datés de plus de 1800 s dans le futur (D95 ; amont : 900) : les kinds 1059 de bitchat sur iOS ont des dates décalées de plus ou moins 900 s.
    rejectEventsNewerThanSeconds = 1800

    # Refuse les événements datés de plus de trois ans dans le passé (valeur amont).
    rejectEventsOlderThanSeconds = 94608000

    # Refuse les événements éphémères datés de plus de 60 s dans le passé (valeur amont conservée ; choix non tranché, voir D95).
    rejectEphemeralEventsOlderThanSeconds = 60

    # Durée de conservation des événements éphémères, en secondes (valeur amont conservée ; choix non tranché, voir D95).
    ephemeralEventsLifetimeSeconds = 300

    # Nombre maximal d'étiquettes par événement (valeur amont).
    maxNumTags = 2000

    # Taille maximale d'une valeur d'étiquette, en octets (valeur amont).
    maxTagValSize = 1024
}

relay {
    # Adresse d'écoute dans le conteneur (écart avec l'amont : boucle locale) ; l'exposition du port est décidée par le compose, jamais ici.
    bind = "0.0.0.0"

    # Port d'écoute (valeur amont).
    port = 7777

    # Nombre de descripteurs de fichiers demandé (D95 : valeur amont écrite explicitement ; les limites du conteneur doivent l'autoriser).
    nofiles = 524288

    # En-tête portant l'adresse réelle du client, posé par le proxy inverse (écart avec l'amont "") ; le port n'est joignable que par ce proxy, car cet en-tête est cru sur parole.
    realIpHeader = "x-forwarded-for"

    auth {
        # Active l'authentification NIP-42 (D95 : valeur amont écrite explicitement).
        enabled = true

        # URL publique exacte du relais en wss:// ; valeur d'exemple, à remplacer à l'installation, sinon l'AUTH échoue pour tous (écart avec l'amont "").
        serviceUrl = "wss://relay.example.org"

        # Kinds dont la lecture exige l'AUTH : seulement 4 (D95 ; amont "4, 1059") car exiger l'AUTH pour 1059 bloquerait bitchat.
        restrictedReadKinds = "4"

        # Limite la lecture des kinds restreints aux clés concernées par l'événement (D95 : valeur amont écrite explicitement).
        restrictReadToInvolvedPubkey = true
    }

    info {
        # Nom du relais annoncé par NIP-11 (écart avec l'amont "strfry default").
        name = "Paresia"

        # Description du relais annoncée par NIP-11 (écart avec l'amont : texte générique).
        description = "Relais Nostr du projet Paresia."

        # Clé publique de l'administrateur, NIP-11 : vide, valeur d'installation.
        pubkey = ""

        # Clé publique du relais, NIP-11 : vide, valeur d'installation.
        self = ""

        # Contact de l'administrateur, NIP-11 : vide, valeur d'installation.
        contact = ""

        # Icône du relais, NIP-11 : vide, valeur d'installation.
        icon = ""

        # Bannière du relais, NIP-11 : vide, valeur d'installation.
        banner = ""

        # Adresse de la politique de confidentialité, NIP-11 : vide, valeur d'installation.
        privacy = ""

        # Adresse des conditions d'utilisation, NIP-11 : vide, valeur d'installation.
        terms = ""

        # Liste des NIP annoncés, NIP-11 : vide, valeur d'installation, laissée vide.
        nips = ""
    }

    # Taille maximale d'un message WebSocket reçu, en octets (valeur amont).
    maxWebsocketPayloadSize = 131072

    # Taille maximale d'un filtre de requête, en octets (valeur amont).
    maxReqFilterSize = 200

    # Intervalle des pings WebSocket, en secondes (valeur amont).
    autoPingSeconds = 55

    # Active le keepalive TCP pour détecter les connexions coupées derrière le proxy (écart avec l'amont false).
    enableTcpKeepalive = true

    # Budget de temps par tranche d'une requête, en microsecondes (valeur amont).
    queryTimesliceBudgetMicroseconds = 10000

    # Limite maximale de résultats par filtre (valeur amont).
    maxFilterLimit = 500

    # Nombre maximal d'étiquettes par filtre (valeur amont).
    maxTagsPerFilter = 3

    # Limite maximale de comptage par filtre (valeur amont).
    maxFilterLimitCount = 1000000

    # Nombre maximal d'abonnements par connexion (valeur amont).
    maxSubsPerConnection = 200

    # Octets sortants en attente avant coupure d'une connexion lente : 32 Mio (D95 : valeur amont écrite explicitement).
    maxPendingOutboundBytes = 33554432

    writePolicy {
        # Plugin de politique d'écriture : journal légal et liste noire (écart avec l'amont "") ; le montage du fichier dans le conteneur relève de l'installation du relais.
        plugin = "/app/plugins/journal_legal.py"

        # Délai de réponse du plugin, en secondes ; au-delà l'écriture échoue (valeur amont).
        timeoutSeconds = 10
    }

    compression {
        # Active la compression WebSocket (valeur amont).
        enabled = true

        # Utilise une fenêtre glissante de compression (valeur amont).
        slidingWindow = true
    }

    logging {
        # Journalise tous les messages reçus : désactivé (valeur amont).
        dumpInAll = false

        # Journalise tous les événements reçus : désactivé (valeur amont).
        dumpInEvents = false

        # Journalise toutes les requêtes reçues : désactivé (valeur amont).
        dumpInReqs = false

        # Journalise les performances des parcours de base : désactivé (valeur amont).
        dbScanPerf = false

        # Journalise les événements invalides (valeur amont).
        invalidEvents = true
    }

    numThreads {
        # Fils d'ingestion des événements (valeur amont).
        ingester = 3

        # Fils de traitement des requêtes (valeur amont).
        reqWorker = 3

        # Fils de surveillance des abonnements (valeur amont).
        reqMonitor = 3

        # Fils de synchronisation negentropy (valeur amont).
        negentropy = 2
    }

    negentropy {
        # Ne JAMAIS créer d'arbre negentropy prédéfini : les commandes « strfry negentropy add » et
        # « strfry negentropy build » sont INTERDITES. Sans arbre, NEG-OPEN n'expose aucun événement
        # de kind 4 ni 1059 ; avec un arbre dont le filtre correspond, les identifiants et les dates de
        # ces événements seraient transmis sans contrôle d'authentification.
        # Active la synchronisation negentropy (valeur amont).
        enabled = true

        # Nombre maximal d'événements par synchronisation (valeur amont).
        maxSyncEvents = 1000000
    }

    filterValidation {
        # Validation stricte des filtres : désactivée, ne jamais l'activer, car elle bloquerait les filtres #g, #r et #x de bitchat (D95).
        enabled = false

        # Nombre maximal de filtres par requête (valeur amont, sans effet tant que la validation est désactivée).
        maxFiltersPerReq = 3

        # Nombre minimal de filtres par requête (valeur amont, sans effet tant que la validation est désactivée).
        minFiltersPerReq = 1

        # Nombre maximal de kinds par filtre (valeur amont, sans effet tant que la validation est désactivée).
        maxKindsPerFilter = 3

        # Kinds autorisés, vide pour tous (valeur amont, sans effet tant que la validation est désactivée).
        allowedKinds = ""

        # Exige un auteur ou une étiquette dans chaque filtre : désactivé, ne jamais l'activer (D95, bitchat).
        requireAuthorOrTag = false
    }
}
