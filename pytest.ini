# =============================================================================
#  pytest.ini — configuration de la suite de tests de Paresia v3
# -----------------------------------------------------------------------------
#  Le dossier temporaire des tests est placé sous .pytest_cache/ (ignoré par
#  Git) et non dans /tmp : sur les postes où /tmp est monté « noexec », les
#  tests qui exécutent un faux binaire échouent sinon avec
#  PermissionError. Il est propre à chaque exécution (conftest.py), de sorte
#  qu'une exécution ne vide plus celui d'une autre ; aucun --basetemp
#  n'est donc fixé ici, et celui d'une ligne de commande l'emporte.
#
#  Suivi des versions
#    0.1.18  2026-11-08  Commentaire indépendant des outils locaux.
#    3.0.0-alpha.41  2026-11-06  Dossier temporaire par exécution : addopts retiré.
#    3.0.0-alpha     2026-11-05  Première version.
# =============================================================================
[pytest]
testpaths = tests
