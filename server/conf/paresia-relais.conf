# SPDX-License-Identifier: AGPL-3.0-or-later
# Paresia : exemple de configuration de backend-relais (Castor et Remus).
# Suivi des versions
#   0.1.7  2026-11-07  Section [remus.plugins] : domaine servi par les fonctions enfichées (D148, D150).
#   0.1.2  2026-11-07  Commentaire de dossier (métriques) : dossier d'état fourni par l'unité livrée.
#   0.1.1  2026-11-07  Numéros d'exemple remplacés à l'installation par ceux du système (D47) ; sections journal et métriques de Castor et Remus (métriques désactivées).
#   3.0.0-alpha.40  2026-11-06  En-tête de la section [sauvegarde.stockage] : python3 -P -m server.sauvegarde.
#   3.0.0-alpha  2026-11-06  Section [sauvegarde.stockage] (C36, D83, D103).
#   3.0.0-alpha  2026-11-05  Sections de Castor (T020, D45).
#   3.0.0-alpha  2026-11-05  Sections de Remus (T021, D46-D54).
#   3.0.0-alpha  2026-11-05  Section [remus.executor] (T022, D45).
#
# Rôle : exemple complet pour backend-relais. Il s'installe en
# /etc/paresia/paresia.conf sur cette machine ; en profil « tout sur une
# machine », en /etc/paresia/conf.d/20-relais.conf (le fichier de base étant
# l'exemple de backend-admin).
# Dépendance : configuration en couches (T015). Chaque démon lit ses sections
# [<composant>.<domaine>] ; les sections des autres composants sont ignorées.
# Aucun secret ici. La couche utilisateur est ignorée par les démons.
# Toute option est remplaçable par PARESIA_CASTOR_<DOMAINE>_<CLE> (majuscules),
# ou PARESIA_REMUS_<DOMAINE>_<CLE> pour Remus.
# Chemins, uid et gid n'ont aucun défaut dans le code : à adapter au déploiement.
# Les uid et gid des sections castor.tunnel, castor.state, remus.server et remus.castor sont des exemples : le script
# d'installation deploy/backend-relais/installer-backend-relais.sh les remplace par ceux que le système a attribués
# aux comptes et groupes de backend-relais.

[castor.tunnel]
# Socket du tunnel : seul l'appelant d'uid indiqué (compte tunnel) peut y
# envoyer castor/light/ping et castor/light/close. Mode 0660, groupe indiqué.
socket = /run/paresia-castor/castor.sock
uid = 972
gid = 973

[castor.state]
# Socket d'état : seul l'uid de Remus peut y envoyer castor/light/state.
# Le chemin doit différer de celui de [castor.tunnel].
socket = /run/paresia-castor/castor-state.sock
uid = 971
gid = 975

[castor.lights]
# Durées en secondes, strictement positives, au plus 3600.
# Le feu reste vert green_s = heartbeat_s + margin_s après chaque ping ;
# green_s ne dépasse pas 3600. heartbeat_s est à aligner sur celui de Romulus.
heartbeat_s = 30
margin_s = 5
# Feux simultanés (et sessions fermées mémorisées), entier de 1 à 16777216.
maximum = 64
# Durée pendant laquelle une session fermée répond session_closed.
closed_s = 10
# Période de purge des feux expirés (journal light_expired).
verification_s = 1

[castor.transport]
# Délai d'une connexion (secondes), taille maximale d'une ligne (octets),
# connexions simultanées par socket.
delai_s = 30
max_line = 1048576
max_connexions = 64

[castor.journal]
# Niveau minimal des événements écrits : debug, info, notice, warning, error ou critical (défaut info).
# --debug force debug. Surcharge : PARESIA_CASTOR_JOURNAL_NIVEAU.
niveau = info

[castor.metriques]
# Métriques Prometheus au format texte (fichier castor.prom écrit de façon atomique).
# actif : true ou false ; false par défaut et dans cet exemple. Surcharge : PARESIA_CASTOR_METRIQUES_ACTIF.
actif = false
# dossier : chemin absolu ; défaut : metriques/ sous le dossier d'état du service (STATE_DIRECTORY), fourni par l'unité livrée (StateDirectory=).
# Surcharge : PARESIA_CASTOR_METRIQUES_DOSSIER.
# dossier = /var/lib/paresia-castor/metriques
# periode_s : période d'écriture en secondes, > 0 et <= 3600 (défaut 15). Surcharge : PARESIA_CASTOR_METRIQUES_PERIODE_S.
periode_s = 15

[remus.server]
# Socket de Remus : seul l'appelant d'uid indiqué (compte tunnel) peut y
# envoyer les commandes relay/... Mode 0660, groupe indiqué.
# stop_s : durée maximale d'attente des opérations en cours à l'arrêt.
socket = /run/paresia-remus/remus.sock
uid = 972
gid = 974
stop_s = 120

[remus.castor]
# Socket d'état de Castor et compte qui la possède (vérifié avant tout envoi).
# delai_s : délai d'une interrogation, au plus wait_s.
socket = /run/paresia-castor/castor-state.sock
uid = 970
delai_s = 2

[remus.light]
# Attente du feu vert (secondes) : une commande attend au plus wait_s, en
# interrogeant Castor toutes les poll_s (poll_s au plus wait_s). check_s :
# période de contrôle du feu pour les flux continus ouverts.
wait_s = 5
poll_s = 0.25
check_s = 5

[remus.transport]
# delai_s doit couvrir wait_s plus le délai maximal des commandes enregistrées
# (le lot 6 le règle) ; Remus refuse de démarrer sinon.
delai_s = 600
max_line = 1048576
max_connexions = 16

[remus.executor]
# Exécuteur des commandes de Remus (table fermée, jamais de shell). Les chemins de
# sudo et de docker sont ceux de l'installation : ceux de l'exemple sont les
# emplacements usuels de Debian, à vérifier avec « command -v sudo » et
# « command -v docker ». Ils n'ont aucun défaut dans le code. Les fichiers doivent
# exister et être exécutables au lancement d'une commande.
sudo = /usr/bin/sudo
docker = /usr/bin/docker
# Délai par défaut d'une commande (secondes, strictement positif, au plus 3600) ;
# à l'échéance : SIGTERM au groupe de processus, puis SIGKILL après kill_grace_s.
delai_s = 60
kill_grace_s = 5
# Sortie conservée par commande (octets, de 1 à 16777216) ; le surplus est lu puis jeté.
# Contrainte : sortie_max * 12 + marge doit rester inférieure à max_line du transport
# de Remus (le JSON échappe en ASCII, jusqu'à 12 octets par caractère hors plan de
# base), pour que la réponse tienne en une ligne.
sortie_max = 65536
# Commandes simultanées ; au-delà, attente d'un emplacement au plus attente_s
# secondes, puis le code command_busy.
simultanes = 4
attente_s = 5

[remus.plugins]
# Fonctions enfichées de Remus : un script et un manifeste par fonction (D148).
# fonctions : dossier des fonctions livrées (défaut /usr/local/lib/paresia/remus/fonctions) ;
# locales : dossier des fonctions locales (défaut /etc/paresia/remus/plugins.d). Tous deux
# appartiennent à root, sans écriture groupe ni autres. Variables :
# PARESIA_REMUS_PLUGINS_FONCTIONS, PARESIA_REMUS_PLUGINS_LOCALES.
# domaine : domaine des actions servi par Remus (un seul en 1.0), minuscules, chiffres et
# tiret bas, 32 caractères au plus ; ni presence ni castor. Sans lui, aucune fonction n'est
# chargée. Variable : PARESIA_REMUS_PLUGINS_DOMAINE.
domaine = relay
# cible : nom sous lequel Remus se présente dans le catalogue (défaut principale).
# Variable : PARESIA_REMUS_PLUGINS_CIBLE.
# cible = principale

[remus.journal]
# Niveau minimal des événements écrits : debug, info, notice, warning, error ou critical (défaut info).
# --debug force debug. Surcharge : PARESIA_REMUS_JOURNAL_NIVEAU.
niveau = info

[remus.metriques]
# Métriques Prometheus au format texte (fichier remus.prom écrit de façon atomique).
# actif : true ou false ; false par défaut et dans cet exemple. Surcharge : PARESIA_REMUS_METRIQUES_ACTIF.
actif = false
# dossier : chemin absolu ; défaut : metriques/ sous le dossier d'état du service (STATE_DIRECTORY), fourni par l'unité livrée (StateDirectory=).
# Surcharge : PARESIA_REMUS_METRIQUES_DOSSIER.
# dossier = /var/lib/paresia-remus/metriques
# periode_s : période d'écriture en secondes, > 0 et <= 3600 (défaut 15). Surcharge : PARESIA_REMUS_METRIQUES_PERIODE_S.
periode_s = 15

# ---------------------------------------------------------------------------
# Sauvegardes de procédure (python3 -P -m server.sauvegarde ; C36, D83, D103)
# ---------------------------------------------------------------------------
[sauvegarde.stockage]
# Copies et relevés des procédures d'installation, rangés en
# <dossier>/<machine>/<AAAAMMJJ-HHMMSS>/ (dossiers root:root 0700, aucune clé privée copiée).
# actif : oui ou non (oui par défaut ; non désactive toute copie et tout relevé, la
# restauration des sauvegardes existantes reste possible). Variable : PARESIA_SAUVEGARDE_STOCKAGE_ACTIF.
actif = oui
# Taille totale maximale de <dossier>/<machine>/, en Mio (1 à 16777216) ; les jeux les plus
# anciens sont supprimés au-delà, jamais le jeu en cours ni le plus récent. Défaut : 64.
taille_max_mio = 64
# Dossier de base des sauvegardes (chemin absolu).
dossier = /var/backups/paresia
# Nom de la machine dans le dossier : backend-relais (expression ^[a-z][a-z0-9-]{0,31}$).
machine = relais
