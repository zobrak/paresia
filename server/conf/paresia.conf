# paresia.conf — exemple complet de configuration de backend-admin (Pollux, pollux-session, Romulus, bunkerd).
# Rôle : fichier de base de la configuration en couches (D29), installé dans /etc/paresia/paresia.conf
#   (propriétaire root, non inscriptible par le compte d'un service). Remplace les anciens fichiers
#   par composant pollux.ini, pollux-session.ini, romulus.ini et bunkerd.ini. Les sections de
#   backend-relais (Remus, Castor) sont ajoutées par leurs tâches.
# Dépendances : lecteur de server.commun.config (bibliothèque standard) ; voir docs/configuration.md.
# Suivi des versions
#   0.1.15  2026-11-08  Sections [romulus.activite] et [romulus.noyau] ; en-tête X-Paresia-Client-IP.
#   0.1.2  2026-11-07  Commentaire de dossier (métriques) : dossier d'état fourni par l'unité livrée.
#   0.1.1  2026-11-07  Sections journal et métriques de Pollux, Romulus et Nisaba (métriques désactivées).
#   0.1.0  2026-11-07  Compte app hors /home : ProtectHome=yes, plus de montage (D44 et D136 révisées).
#   0.1.8  2026-11-07  Romulus : sections de service décrites par des déclarations (greffons), [romulus.nisaba] et [romulus.plugins] en commentaire.
#   3.0.0-alpha.41  2026-11-06  Section [pollux.signature] et max_signature de [pollux-session.auth] ; option flux_max_simultanes de [romulus.relay] (D85, D111).
#   3.0.0-alpha.41  2026-11-06  Sections [romulus.bunker] et [romulus.relay], contrôle Origin (T038, D10, D15).
#   3.0.0-alpha.40  2026-11-06  En-tête de la section [sauvegarde.stockage] : python3 -P -m server.sauvegarde.
#   3.0.0-alpha.32  2026-11-06  Commentaire de [pollux.transport] : appels aux pairs hors du verrou global (T010).
#   3.0.0-alpha  2026-11-06  Section [sauvegarde.stockage] (C36, D83, D103).
#   3.0.0-alpha  2026-11-05  Fichier unique en couches (T015) : reprend pollux.ini, pollux-session.ini et romulus.ini.
#   3.0.0-alpha.32  2026-11-06  [bunkerd.signature] log_n (T006, signature de la liste de sourdine).
#   3.0.0-alpha.29  2026-11-06  Chemins des sockets : un dossier d'exécution par unité (T016, D40) ; plus de /run/paresia.
#   3.0.0-alpha  2026-11-05  Sections de bunkerd 2.0.0 (T005, B4, D29) : reprennent bunkerd.ini, supprimé ;
#                      web.user obligatoire même page désactivée ; ws:// hors .onion refusé aussi sur ctl.sock (B3) ;
#                      un saut de ligne final dans un nom, un relais ou un secret chiffré est refusé (1.9.0
#                      l'acceptait) ; adresse de relais de 255 caractères au plus ; relay_identity non supprimable
#                      par l'administration ; romulus_user d'uid 0 refusé ; admin.max_line abaissé à 65536.
#   3.0.0-alpha.40  2026-11-06  Sections [nisaba.*] (T031, D87) : socle de Nisaba, processus annexe du journal légal.
#   3.0.0-alpha.41  2026-11-06  Sections [nisaba.source], [nisaba.ots], [nisaba.droits] (T033, D87, C38) : copie,
#                      scellement, horodatage OpenTimestamps, modes et ACL repris des scripts journal-legal-*.
#
# Couches, par priorité croissante (la dernière qui définit une option l'emporte) :
#   1. /etc/paresia/paresia.conf (ce fichier) ;
#   2. /etc/paresia/conf.d/NN-*.conf (ordre lexical, deux chiffres en préfixe) ;
#   3. $XDG_CONFIG_HOME/paresia/*.conf (défaut ~/.config/paresia/) : programmes lancés par
#      un utilisateur seulement ; les démons n'ont PAS de couche utilisateur ;
#   4. variables d'environnement PARESIA_<COMPOSANT>_<DOMAINE>_<CLE> (majuscules, tirets en
#      « _ »), fixées par l'unité systemd pour un démon. Exemple : PARESIA_POLLUX_SESSIONS_TIMEOUT_S.
#      pollux-session ne lit AUCUNE variable d'environnement (elle vient du client SSH).
# Sections : [<composant>.<domaine>] ; chaque composant ne lit que ses propres sections.
# Fichier explicite (tests, conteneurs) : --config <chemin> ou PARESIA_<COMPOSANT>_CONFIG
# remplace les couches fichier 1 à 3 (les variables PARESIA_* s'appliquent ensuite).
# Chaque fichier lu : régulier, sans lien symbolique, propriétaire root ou uid du programme,
# sans écriture groupe/autres, au plus 1 Mio. Dossiers des sockets de Pollux et de Romulus :
# un RuntimeDirectory= par unité (/run/paresia-pollux, /run/paresia-romulus, D40) ; celui du
# tunnel (/run/paresia-tunnel) appartient à l'unité du tunnel.
# Adapter tous les chemins, uid et gid au déploiement ; aucun défaut dans le code pour eux.
# Aucun secret dans ce fichier : les secrets sont des fichiers montés.

# ---------------------------------------------------------------------------
# Pollux : présence (python3 -m server.pollux)
# ---------------------------------------------------------------------------
[pollux.sessions]
# Écoute de pollux-session ; uid du compte app, groupe de la socket (mode 0660).
socket = /run/paresia-pollux/pollux.sock
uid = 1001
gid = 1001
# Durées en secondes, strictement positives, <= 3600.
# Refus au démarrage si heartbeat_s >= timeout_s ou verification_s > timeout_s.
heartbeat_s = 30
timeout_s = 90
# Période de vérification de l'expiration monotone.
verification_s = 0.1
# Sessions simultanées ; entier de 1 à 16777216, défaut 16.
maximum = 16

[pollux.signature]
# Preuve de possession de la clé SSH avant toute ouverture (D20, D28).
# Chemin obligatoire (le lecteur de configuration n'admet aucun défaut pour un chemin) ;
# même valeur que [pollux-session.auth] authorized_keys. Relecture à chaque vérification
# (retrait d'une ligne immédiat) ; ouverture O_NOFOLLOW.
authorized_keys = /var/lib/paresia-app/.ssh/authorized_keys
# Durée monotone du défi, secondes (> 0, <= 3600), défaut 60 ; un seul essai par connexion.
challenge_ttl_s = 60
# Espace de noms obligatoire, attendu aussi par l'application.
namespace = paresia-presence
# Taille maximale du texte base64 ASCII, en octets ; 1 à 16777216, défaut 2048.
max_signature = 2048
# Surcharges : PARESIA_POLLUX_SIGNATURE_AUTHORIZED_KEYS, _CHALLENGE_TTL_S,
# _NAMESPACE et _MAX_SIGNATURE. Aucun mode sans preuve.
# Codes : challenge_required, challenge_expired, signature_invalid (aucun détail de rejet
# révélé au client), not_available si cryptography est absente. Forme invalide : bad_request.
# Journal : challenge_issued, auth_ok, auth_failed (reason technique), key_ignored ;
# aucun défi, aucune signature, aucun jeton. Vérification hors du verrou global.

[pollux.relay]
# Écoute réservée à l'uid de Romulus ; groupe de cette socket.
socket = /run/paresia-pollux/pollux-relay.sock
uid = 1002
gid = 1002

[pollux.romulus]
# Destination persistante ; uid du serveur vérifié avant tout envoi.
socket = /run/paresia-romulus/romulus.sock
uid = 1002

[pollux.castor]
# Socket locale du tunnel (dossier et ACL de traversée : unité du tunnel) ; uid du processus qui l'écoute (à adapter).
socket = /run/paresia-tunnel/pollux/castor.sock
uid = 1003

[pollux.transport]
# Échéance totale d'une requête entrante (lecture, traitement, réponse).
# Prévoir plus que timeout_s et la durée des notifications aux pairs.
# Les appels vers Romulus et Castor ne se font plus sous le verrou global de Pollux :
# ce verrou ne couvre plus aucun appel vers un pair ; un état et un verrou propres à
# chaque session ordonnent ses échanges avec Castor. Un Castor lent ne retarde donc ni
# les autres sessions, ni les pings, ni les expirations. Conséquence acceptée : le client
# Romulus reste unique et ses appels se font l'un après l'autre, si bien qu'un Romulus
# lent retarde les autres ouvertures et fermetures vers Romulus (jamais les pings de
# session, les échanges avec Castor ni les expirations). Garder pair_delai_s court devant
# timeout_s (quelques secondes).
# Contrainte conservée comme pire cas prudent : maximum x pair_delai_s < timeout_s
# (90 s par défaut : 16 x 5 s = 80 s), pour la perte de Romulus et l'arrêt.
delai_s = 120
# Échéance de chaque appel sortant ; aucun nouvel essai de fermeture Castor.
pair_delai_s = 5
# Longueur NDJSON en octets, LF compris ; 1 à 16777216.
max_line = 1048576
# Plafond des connexions sur CHAQUE écoute, entre 1 et 1024.
max_connexions = 64

# Codes stables de Pollux : bad_request (params/enveloppe), unknown_action (mauvaise écoute),
# session_closed (session absente), session_limit (maximum atteint),
# peer_unavailable (Romulus/Castor), protocol_version_mismatch, line_too_long,
# internal_error. Traductions déjà présentes dans les deux catalogues.
# Journal : session_opened / session_closed (session, admin, source, reason),
# peer_unavailable (peer, action, session), peer_refused (uid), sans jeton.
# reason de fermeture : timeout, disconnect, close, romulus_lost.

[pollux.journal]
# Niveau minimal des événements écrits : debug, info, notice, warning, error ou critical (défaut info).
# --debug force debug. Surcharge : PARESIA_POLLUX_JOURNAL_NIVEAU.
niveau = info

[pollux.metriques]
# Métriques Prometheus au format texte (fichier pollux.prom écrit de façon atomique).
# actif : true ou false ; false par défaut et dans cet exemple. Surcharge : PARESIA_POLLUX_METRIQUES_ACTIF.
actif = false
# dossier : chemin absolu ; défaut : metriques/ sous le dossier d'état du service (STATE_DIRECTORY), fourni par l'unité livrée (StateDirectory=).
# Surcharge : PARESIA_POLLUX_METRIQUES_DOSSIER.
# dossier = /var/lib/paresia-pollux/metriques
# periode_s : période d'écriture en secondes, > 0 et <= 3600 (défaut 15). Surcharge : PARESIA_POLLUX_METRIQUES_PERIODE_S.
periode_s = 15

# ---------------------------------------------------------------------------
# pollux-session : relais SSH de présence (lanceur server/bin/pollux-session)
# Aucune variable d'environnement n'est lue et il n'y a pas d'argument : seules les
# couches fichier 1 et 2 agissent. L'environnement hérité de sshd est vidé par le lanceur.
# Fichiers régulier root ou utilisateur du service, non modifiables par groupe/autres.
# ---------------------------------------------------------------------------
[pollux-session.transport]
# Chemin absolu obligatoire, aucun défaut dans le code.
socket = /run/paresia-pollux/pollux.sock
# Délais indépendants de ping et de réponse ; secondes, > 0 et <= 3600.
timeout_s = 90
# Échéance ABSOLUE (secondes) depuis le démarrage du processus : tant qu'aucun open
# n'a réussi, la session est coupée (code 1) à démarrage + open_timeout_s, quoi qu'il
# arrive (réponses de Pollux, ping avant open, bruit), sans réarmement. Après un open
# réussi, seul le délai « sans ping » (timeout_s) s'applique.
open_timeout_s = 30
# Taille maximale incluant LF ; 1 à 16777216 octets. Lecture par blocs de 64 Kio ;
# pire cas mémoire : environ 2 x max_line (ligne en cours, vers Pollux et vers
# l'application) plus les réponses d'erreur d'un bloc ; 1 Mio suffit.
max_line = 1048576

[pollux-session.auth]
# Chemin absolu obligatoire du fichier du compte SSH.
authorized_keys = /var/lib/paresia-app/.ssh/authorized_keys
# Taille maximale (octets) de la signature base64 relayée ; 1 à 16777216, défaut 2048
# (clé RSA de 4096 bits) ; même valeur que [pollux.signature] max_signature.
max_signature = 2048
# SSH_USER_AUTH est fourni par sshd (ExposeAuthInfo yes).
# SSH_CONNECTION fournit l'adresse source ; aucune identité fournie par le client.
# Refus d'identité : auth_info_unavailable ; pair absent : peer_unavailable.
# Entrées : bad_request, unknown_action, protocol_version_mismatch, line_too_long.
# Codes de sortie : 0 fin normale, 1 délai, 2 pair absent, 3 protocole/auth/config.
# stdout : NDJSON uniquement ; journal JSON par syslog ; stderr inutilisé.
#
# Consignes de sécurité d'installation
# - authorized_keys est ouvert avec O_NOFOLLOW (lien symbolique final refusé) ;
#   propriétaire = utilisateur du service ou root, sans écriture groupe/autres.
#   Il en va de même du fichier SSH_USER_AUTH (propriétaire = utilisateur du service).
# - Une clé présente sur deux lignes d'authorized_keys (même avec des commentaires
#   différents) est refusée : auth_info_unavailable.
# - sshd du compte app : AcceptEnv vide et PermitUserEnvironment no, pour que le
#   client ne puisse pas fournir de variable d'environnement.
# - Le socket de Pollux doit se trouver dans un dossier non modifiable par un tiers.
# - Risque résiduel (D1) : tout processus de l'uid app peut forger SSH_USER_AUTH
#   (fichier qu'il possède) ; l'identité n'est fiable que si seul sshd tourne sous cet uid.
# - sshd : StrictModes yes (contrôle des droits du home, de ~/.ssh et d'authorized_keys).
# - Le compte app a un shell de connexion sans fichier d'environnement piloté par le
#   client (pas de ~/.bashrc, ~/.profile ni équivalent modifiable par la session).
# - Une ligne authorized_keys à guillemet non fermé fait refuser toute identité
#   (fail-closed, choix voulu) : auth_info_unavailable.

# ---------------------------------------------------------------------------
# Romulus : point de contact (python3 -m server.romulus)
# Les sockets préexistantes ne sont jamais supprimées au démarrage. Dossier des sockets :
# RuntimeDirectory=paresia-romulus de l'unité (recréé à chaque démarrage, supprimé à l'arrêt, D40).
# ---------------------------------------------------------------------------
[romulus.presence]
socket = /run/paresia-romulus/romulus.sock
uid_pollux = 1001
# Groupe numérique ; le démon doit pouvoir lui attribuer la socket (mode 0660).
gid = 1001
# Échéance NDJSON à partir du premier octet ; expiration = rupture D9.
# Durées > 0 et <= 3600 s. L'inactivité entre deux messages n'expire pas.
timeout_s = 30
# Octets, LF compris ; 1 à 16 Mio.
max_line = 1048576
# Connexions simultanées : 1 à 1024.
max_connexions = 64
# Sessions simultanées par connexion de Pollux ; au-delà : session_limit.
max_sessions = 1024

[romulus.http]
# 3.0.0-alpha.32 · 2026-11-06 : limites des exports binaires (T013).
# Archive gzip maximale en octets (1 à 16 Mio) ; défaut 8 Mio. Excès : 422.
# Surcharge : PARESIA_ROMULUS_HTTP_EXPORT_MAX_OCTETS.
export_max_octets = 8388608
# Préparations et envois simultanés ; défaut 2. Excédent : 503, sans attente.
# Surcharge : PARESIA_ROMULUS_HTTP_EXPORT_MAX_SIMULTANES.
export_max_simultanes = 2
socket = /run/paresia-romulus/romulus-http.sock
uid_lighttpd = 33
gid = 33
# Délai de lecture de la socket (> 0 et <= 3600 s).
timeout_s = 30
# Corps maximal en octets (1 à 16 Mio) ; défaut 64 Kio.
max_body = 65536
# Connexions HTTP simultanées : 1 à 1024. Excédent : fermé sans réponse, journalisé.
max_connexions = 64
# Échéance globale de lecture de la requête (en-têtes et corps), > 0 et <= 3600 s,
# en plus du délai par lecture ci-dessus. Expiration : fermeture sans réponse.
read_deadline_s = 30
# Nombre maximal d'en-têtes et taille cumulée maximale (octets) de la requête.
max_headers = 100
max_header_bytes = 16384
# En-tête HTTP qui porte l'adresse du client : il est posé par le frontal de confiance (par exemple
# par la directive http-request set-header de HAProxy), avec une seule valeur qui remplace toute
# valeur entrante, et lighttpd le laisse passer. X-Forwarded-For, que lighttpd complète toujours,
# est ignoré de Romulus. Sans frontal qui pose l'en-tête, l'adresse est absente et Romulus
# utilise fallback_ip.
client_ip_header = X-Paresia-Client-IP
# Adresse de repli journalisée avec address_fallback=true si en-tête absent,
# multiple ou invalide. Aucune valeur brute invalide n'est journalisée.
fallback_ip = 127.0.0.1

# POST /api/admin/<action> ; seuls bunker, legal et relay du protocole § 5.
# Corps = params (objet JSON), vide = {} ; session interdit à la racine.
# Cookie admin_token ou X-Admin-Token ; aucun cookie émis par Romulus.
# Contrôle Origin (D15) : un seul Host et un seul Origin, la partie de Origin après « :// »
# égale à Host ; sinon 403 origin_refused (Origin: null refusé). Il vient après le jeton
# et les contrôles de taille, avant la lecture du corps et tout appel d'action.
# Aiguillage : chaque domaine vient d'une déclaration de service (fichier paresia-yang-<nom>.toml,
# dossiers de [romulus.plugins]) ; la section de configuration d'un service est celle que sa
# déclaration nomme. Déclarations livrées : bunker/* vers bunkerd ([romulus.bunker]), relay/* vers
# Remus avec ping de Pollux ensuite ([romulus.relay]), nisaba/* ([romulus.nisaba], facultative) ;
# legal/* : 501 not_available. Une section sans déclaration chargée est refusée (config_unknown_section).
# Statuts : 400 bad_request/token_conflict ; 403 token_missing/token_unknown/origin_refused/
# session_closed ; 404 unknown_action/unknown_identity/client_not_authorized ; 405 bad_request
# (autre méthode) ; 409 identity_exists/identity_unlocked/relay_identity_protected ;
# 413 body_too_large ; 422 export_too_large et codes de valeur refusée de bunkerd ;
# 500 internal_error ; 501 not_available ; 502 command_failed ; 503 peer_unavailable/
# relay_light_red/command_busy/export_busy ; 504 command_timeout.
# NDJSON : bad_request, unknown_action, session_closed, internal_error,
# protocol_version_mismatch et line_too_long (ces deux derniers ferment le pair).
# Journaux JSON sur stdout.

[romulus.bunker]
# Aiguillage de bunker/* : socket d'administration de bunkerd ([bunkerd.admin] socket) et
# uid du compte de bunkerd, vérifié (SO_PEERCRED) avant l'envoi. Valeur d'illustration :
# adapter à l'installation.
# Surcharge : PARESIA_ROMULUS_BUNKER_<CLE>.
bunkerd_socket = /run/nostr-bunker/admin.sock
bunkerd_uid = 1004
# Échéance d'un appel (> 0 et <= 3600 s) ; défaut 120, supérieure à [bunkerd.admin] delai_s.
delai_s = 120
# Longueur maximale d'une ligne en octets ; 1 à 16 Mio ; défaut 65536.
max_line = 65536

[romulus.relay]
# Aiguillage de relay/* : socket locale du tunnel vers Remus et uid du processus qui l'écoute ;
# socket de Pollux pour le ping de session (pollux-relay.sock) et uid de Pollux.
# Surcharge : PARESIA_ROMULUS_RELAY_<CLE>.
remus_socket = /run/paresia-tunnel/romulus/remus.sock
remus_uid = 1003
pollux_socket = /run/paresia-pollux/pollux-relay.sock
pollux_uid = 1002
# Attente du résultat de Remus (> 0 et <= 3600 s) ; défaut 600, au moins [remus.transport] delai_s.
delai_s = 600
# Échéance de l'appel de ping à Pollux ; défaut 5 ; strictement inférieure à heartbeat_s.
ping_delai_s = 5
# Un ping par session au plus toutes les heartbeat_s ; même valeur que [pollux.sessions] heartbeat_s.
heartbeat_s = 30
# Flux HTTP simultanés : 1 à 1024, défaut 8 ; excédent : 503 command_busy.
# Surcharge : PARESIA_ROMULUS_RELAY_FLUX_MAX_SIMULTANES.
flux_max_simultanes = 8
# Longueur maximale d'une ligne en octets ; 1 à 16 Mio ; défaut 1048576.
max_line = 1048576

# [romulus.nisaba]
# Aiguillage de nisaba/* (service facultatif, déclaré par paresia-yang-nisaba) : socket réservée à
# Romulus du processus du journal légal ([nisaba.socket] socket) et uid de son compte, vérifié
# avant l'envoi. Sans cette section, nisaba/* répond 501 not_available.
# Valeurs d'illustration : adapter à l'installation. Surcharge : PARESIA_ROMULUS_NISABA_<CLE>.
# socket = /run/paresia-nisaba/nisaba.sock
# uid = 1005
# Échéance d'un appel (> 0 et <= 3600 s) ; défaut 120.
# delai_s = 120
# Longueur maximale d'une ligne en octets ; 1 à 16 Mio ; défaut 1048576.
# max_line = 1048576

# [romulus.plugins]
# Dossiers des déclarations de services : livrées (défaut /usr/local/lib/paresia/romulus/services)
# et locales (défaut /etc/paresia/romulus/services.d). Fichiers et dossiers appartenant à root,
# sans écriture groupe ni autres. Une déclaration livrée défectueuse refuse le démarrage ; une
# déclaration locale défectueuse est ignorée et journalisée (service_declaration_rejected).
# Surcharge : PARESIA_ROMULUS_PLUGINS_LIVREES et PARESIA_ROMULUS_PLUGINS_LOCALES.
# livrees = /usr/local/lib/paresia/romulus/services
# locales = /etc/paresia/romulus/services.d

[romulus.journal]
# Niveau minimal des événements écrits : debug, info, notice, warning, error ou critical (défaut info).
# --debug force debug. Surcharge : PARESIA_ROMULUS_JOURNAL_NIVEAU.
niveau = info

[romulus.activite]
# Journal d'activité de Romulus : qui fait quoi (fichier activite.jsonl), circulaire et borné,
# sans params, data, jeton ni texte reçu. Journal d'exploitation, non sauvegardé.
# detail : 1 (actions et refus), 2 (ajoute durée et jumeau) ou 3 (ajoute le dépannage du protocole) ;
# défaut 1. Surcharge : PARESIA_ROMULUS_ACTIVITE_DETAIL.
detail = 1
# taille_max : volume total des deux fichiers en octets, de 65536 à 16777216 (défaut 1048576).
taille_max = 1048576
# dossier : chemin absolu ; défaut : activite/ sous le dossier d'état du service (STATE_DIRECTORY).
# dossier = /var/lib/paresia-romulus/activite
# Refus sans session de même nature et de même origine regroupés par minute : plafond d'un
# regroupement (1 à 1000000) et nombre de regroupements ouverts (1 à 1024), à revoir après essai réel.
regroupement_max = 100000
regroupements_simultanes = 64

[romulus.noyau]
# dossier_etat : racine des dossiers d'état des démons (paresia-<démon>/metriques/<démon>.prom),
# lue par le domaine kernel (défaut /var/lib). Surcharge : PARESIA_ROMULUS_NOYAU_DOSSIER_ETAT.
dossier_etat = /var/lib

[romulus.metriques]
# Métriques Prometheus au format texte (fichier romulus.prom écrit de façon atomique).
# actif : true ou false ; false par défaut et dans cet exemple. Surcharge : PARESIA_ROMULUS_METRIQUES_ACTIF.
actif = false
# dossier : chemin absolu ; défaut : metriques/ sous le dossier d'état du service (STATE_DIRECTORY), fourni par l'unité livrée (StateDirectory=).
# Surcharge : PARESIA_ROMULUS_METRIQUES_DOSSIER.
# dossier = /var/lib/paresia-romulus/metriques
# periode_s : période d'écriture en secondes, > 0 et <= 3600 (défaut 15). Surcharge : PARESIA_ROMULUS_METRIQUES_PERIODE_S.
periode_s = 15

# ---------------------------------------------------------------------------
# bunkerd 2.0.0 : superviseur de signataires NIP-46 (python3 -m server.bunkerd)
# ---------------------------------------------------------------------------
# Fichier explicite : --config /chemin/absolu/paresia.conf ou PARESIA_BUNKERD_CONFIG ;
# --config est prioritaire. Toute option est remplaçable par PARESIA_BUNKERD_<DOMAINE>_<CLE>
# en majuscules (exemple : PARESIA_BUNKERD_ADMIN_SOCKET). Environnement fixé par l'unité systemd.
# Jamais de secret ici : le secret chiffré reste dans les profils nak.
# Toutes les options de bunkerd sont obligatoires, sauf admin.delai_s, admin.max_line
# et admin.max_connexions (valeurs par défaut indiquées).
# Plus aucune variable NOSTR_BUNKER_* n'est lue (1.9.0).
# Valeurs d'illustration : adapter les chemins et les comptes au déploiement.
[bunkerd]
# Identité servant de clé du relais (B2), posée par l'administrateur root ; l'interface
# ne la modifie jamais. Nom au format des identités (a-z, 0-9, - et _, 32 caractères au
# plus). Valeur « (none) » : aucune clé de relais. Une identité inexistante est signalée
# au journal (relay_identity_unknown), aucune identité n'est alors marquée. La socket
# d'administration refuse de la supprimer (relay_identity_protected) ; ctl.sock (root) reste libre.
relay_identity = (none)

[bunkerd.etat]
# Dossier d'état : profils nak (.config/nak/bunker/<identité>) et bunker.json.
home = /var/lib/nostr-bunker

[bunkerd.outils]
# Binaire nak (NIP-46) et setfacl (paquet acl), pour les ACL des sockets.
nak = /usr/local/bin/nak
setfacl = /usr/bin/setfacl

[bunkerd.controle]
# Socket de contrôle (root, bunkerctl) ; chemin conservé de la version 1.9.0.
socket = /run/nostr-bunker/ctl.sock

[bunkerd.web]
# Page web de déverrouillage et interface de l'applet, derrière le serveur web.
# Socket Unix, ou « (none) » pour désactiver la page. Compte autorisé par ACL.
# user reste obligatoire même lorsque la page est désactivée (valeur « (none) » ci-dessus).
socket = /run/nostr-bunker/web.sock
user = www-data

[bunkerd.admin]
# Socket d'administration jumeaux/1 : seul le compte de Romulus (D21) y est admis
# (SO_PEERCRED, puis ACL posée par bunkerd : x sur le dossier, rw sur la socket).
# Actions : bunker/identity/list|clients|add|secret|relays|authorize|revoke|timeout|remove
# et bunker/relay-key/sign-mute-list.
# Si le compte n'existe pas, si son uid est 0 (admin_disabled, reason=invalid_account) ou si
# l'ACL échoue, la socket est retirée, l'erreur est journalisée (admin_disabled) et bunkerd continue.
socket = /run/nostr-bunker/admin.sock
romulus_user = paresia-romulus
# Échéance totale d'une requête, secondes (> 0, <= 3600) ; défaut 90. Une opération peut
# attendre jusqu'à 60 s la fin d'un déverrouillage (verrou global, B9).
delai_s = 90
# Longueur maximale d'une ligne en octets, LF compris ; 1 à 16777216 ; défaut 65536
# (une requête d'administration tient en quelques centaines d'octets).
max_line = 65536
# Connexions simultanées ; 1 à 1024 ; défaut 16.
max_connexions = 16

[bunkerd.signature]
# Action bunker/relay-key/sign-mute-list : plafond du paramètre log_n d'un secret chiffré
# (scrypt, NIP-49) ; 1 à 20 ; défaut 20 (1 Gio de mémoire, RFC 7914). Un secret chiffré dont
# le log_n dépasse ce plafond est refusé (log_n_too_high) avant tout calcul. Une valeur
# supérieure à 20 est refusée au démarrage (config_invalid). Variable de remplacement :
# PARESIA_BUNKERD_SIGNATURE_LOG_N. Les déchiffrements sont sérialisés (un seul à la fois,
# pause de 2 s après une passphrase refusée) : mémoire bornée à un scrypt, un essai de
# passphrase au plus toutes les 2 s ; les autres actions du bunker restent servies. Les
# erreurs de format du secret chiffré sont rendues par bad_passphrase.
log_n = 20

# Codes d'erreur : voir docs/protocole.md (§ 5 et § 9) : unknown_action, bad_request,
# invalid_identity, unknown_identity, identity_exists, identity_unlocked, invalid_relays,
# invalid_ncryptsec, invalid_client, client_not_authorized, invalid_timeout,
# confirmation_mismatch, relay_identity_protected, not_relay_key, bad_passphrase,
# invalid_pubkeys, invalid_passphrase, pubkey_mismatch, log_n_too_high, not_available,
# internal_error.
# Journal (sortie standard, une ligne JSON, composant bunkerd), sans secret ni params :
# bunkerd_ready, bunkerd_stopped, state_unreadable, startup_failed, service_failed,
# identity_unlocked, identity_locked (reason : admin_request, web_request, applet_request,
# idle, nak_exited, unlock_failed, shutdown), identity_added, identity_removed,
# identity_relays_changed, identity_secret_replaced, identity_timeout_changed,
# client_authorized, client_revoked, admin_started, admin_disabled (reason : unknown_account,
# invalid_account, acl_failed, socket_failed), admin_operation
# (session, action, identity, result, code), peer_refused (uid), web_started, web_disabled,
# web_unlock, web_unlock_refused, web_unlock_blocked, web_timeout_set, uri_shown,
# ctl_peer_refused, relay_identity_unknown, idle_check_failed.

# ----------------------------------------------------------------------------------------------------
# Nisaba (D87) : processus annexe du journal légal de backend-admin (python3 -P -s -B -m server.nisaba).
# Toutes les options sans défaut sont obligatoires (absente : démarrage refusé, config_missing).
# Variables d'environnement : PARESIA_NISABA_<DOMAINE>_<CLE>. Les valeurs ci-dessous sont des
# valeurs d'illustration (chemins, uid, gid, compte, nom d'hôte générique backend-relais).

[nisaba.socket]
# Socket jumeaux/1 de Romulus (actions de lecture : nisaba/state/status, nisaba/state/verify).
# Dossier : RuntimeDirectory=paresia-nisaba. Seul l'uid de Romulus est admis (SO_PEERCRED).
socket = /run/paresia-nisaba/nisaba.sock
uid_romulus = 990
# Groupe propriétaire de la socket (groupe dédié ; entier, il n'existe pas de type gid).
gid = 990
# Échéance totale d'une requête, secondes (> 0, <= 3600) ; défaut 30.
delai_s = 30
# Longueur maximale d'une ligne en octets, LF compris ; 1 à 16777216 ; défaut 65536.
max_line = 65536

[nisaba.ctl]
# Socket de contrôle (CLI python3 -m server.nisaba.ctl), mode 0600, uid indiqué seul admis.
socket = /run/paresia-nisaba/nisaba-ctl.sock
uid = 0

[nisaba.journal]
# Copie du journal légal (MANIFEST, journal-AAAA-MM-JJ.jsonl, seals/).
dossier = /var/log/paresia/journal-legal
# Compte de Romulus, lecteur du journal par ACL (posée par T033).
compte_acl = paresia-romulus
# Niveau minimal des événements écrits : debug, info, notice, warning, error ou critical (défaut info).
# --debug force debug. Surcharge : PARESIA_NISABA_JOURNAL_NIVEAU.
niveau = info
# Outils lancés par argv, sans interpréteur de commandes (e2fsprogs).
lsattr = /usr/bin/lsattr
chattr = /usr/bin/chattr

[nisaba.metriques]
# Métriques Prometheus au format texte (fichier nisaba.prom écrit de façon atomique).
# actif : true ou false ; false par défaut et dans cet exemple. Surcharge : PARESIA_NISABA_METRIQUES_ACTIF.
actif = false
# dossier : chemin absolu ; défaut : metriques/ sous le dossier d'état du service (STATE_DIRECTORY).
# Surcharge : PARESIA_NISABA_METRIQUES_DOSSIER.
# dossier = /var/lib/paresia-nisaba/metriques
# periode_s : période d'écriture en secondes, > 0 et <= 3600 (défaut 15). Surcharge : PARESIA_NISABA_METRIQUES_PERIODE_S.
periode_s = 15

[nisaba.horaire]
# Tous les horaires sont en UTC, format HH:MM strict. Cron suivait l'heure locale du système :
# l'ancienne ligne « 23 3 * * * » (heure locale) n'équivaut à 03:23 UTC que si le fuseau est UTC.
# Période de la copie, secondes (> 0, <= 3600) ; défaut 60. Tâche enregistrée par T033.
copie_s = 60
# Scellement quotidien (rattrapage depuis la dernière journée inscrite à chaque démarrage). Obligatoire.
scellement = 00:20
# Purge quotidienne. Obligatoire.
purge = 03:23
# Conservation, en jours (1 à 36500, soit 100 ans) ; défaut 365. Une journée D est supprimée à D + 366 jours.
conservation_jours = 365
# Attente de la tâche en cours à l'arrêt, secondes (> 0, <= 3600) ; défaut 30.
arret_s = 30

[nisaba.etat]
# Dossier d'état (derniers échecs ECHEC_*) : même chemin que le StateDirectory= de l'unité (T034).
dossier = /var/lib/paresia-nisaba
# Échecs conservés par tâche ; défaut 20 (plafonné à 40 par le code).
historique = 20

[nisaba.source]
# Copie du journal depuis backend-relais : utilisateur@hôte:/ (rsync par ssh, clé dédiée bridée côté
# relais). Format imposé : nom de compte, @, hôte ou adresse, :/ puis un chemin éventuel terminé par /.
source = journalpull@backend-relais:/
# Clé privée SSH dédiée : donnée à ssh par son chemin, jamais lue ni copiée par Nisaba. Caractères admis :
# lettres, chiffres et _ . / + @ % : = , - (pas d'espace : le chemin est composé dans l'argument -e de rsync).
cle_ssh = /etc/paresia/journal-legal-pull.key
# Programmes lancés par argv, sans interpréteur de commandes ; ssh : mêmes restrictions de caractères.
rsync = /usr/bin/rsync
ssh = /usr/bin/ssh
# Délai de connexion ssh (ConnectTimeout) et d'inactivité de rsync (--timeout), secondes (> 0, <= 3600) ;
# défauts 20 et 50, comme les scripts.
connexion_s = 20
rsync_s = 50

[nisaba.ots]
# Client OpenTimestamps (ots stamp, ots upgrade) ; seule l'empreinte de la ligne du registre part sur Internet.
ots = /opt/opentimestamps/bin/ots
# Preuve encore incomplète après ce nombre de jours : ECHEC_HORODATAGE (entier de 1 à 36500) ; défaut 3.
attente_max_jours = 3
# Délai de chaque appel au client, secondes (> 0, <= 3600) ; défaut 120.
delai_s = 120

[nisaba.droits]
# Modes, ACL et attributs du journal légal. Outils lancés par argv : chattr (e2fsprogs, droit
# CAP_LINUX_IMMUTABLE donné par l'unité), setfacl et getfacl (acl). lsattr : [nisaba.journal].
chattr = /usr/bin/chattr
setfacl = /usr/bin/setfacl
getfacl = /usr/bin/getfacl
# Compte de Romulus, lecteur du journal par ACL (même compte que compte_acl de [nisaba.journal]).
compte = paresia-romulus

# Échecs (sortie standard, donc journald ; code en tête de ligne, préfixe de priorité sd-daemon(3)) :
# ECHEC_COPIE, ECHEC_ACL, ECHEC_SCELLEMENT, ECHEC_HORODATAGE et, nouveau, ECHEC_PURGE. L'identifiant
# syslog est celui de l'unité (nisaba), non plus journal-legal-pull|seal|acl|purge.
# Codes d'erreur des sockets : unknown_action, bad_request, command_busy, not_available, internal_error.
# ---------------------------------------------------------------------------
# Sauvegardes de procédure (python3 -P -m server.sauvegarde ; C36, D83, D103)
# ---------------------------------------------------------------------------
[sauvegarde.stockage]
# Copies et relevés des procédures d'installation, rangés en
# <dossier>/<machine>/<AAAAMMJJ-HHMMSS>/ (dossiers root:root 0700, aucune clé privée copiée).
# actif : oui ou non (oui par défaut ; non désactive toute copie et tout relevé, la
# restauration des sauvegardes existantes reste possible). Variable : PARESIA_SAUVEGARDE_STOCKAGE_ACTIF.
actif = oui
# Taille totale maximale de <dossier>/<machine>/, en Mio (1 à 16777216) ; les jeux les plus
# anciens sont supprimés au-delà, jamais le jeu en cours ni le plus récent. Défaut : 64.
taille_max_mio = 64
# Dossier de base des sauvegardes (chemin absolu).
dossier = /var/backups/paresia
# Nom de la machine dans le dossier : backend-admin (expression ^[a-z][a-z0-9-]{0,31}$).
machine = admin
